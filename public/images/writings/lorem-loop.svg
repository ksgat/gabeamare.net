<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Build break learn repeat loop</title>
  <desc id="description">Four labeled boxes connected from build to break to learn to repeat.</desc>
  <rect width="1200" height="520" fill="#f7f4ed"/>
  <g fill="none" stroke="#0e0e0d" stroke-width="4">
    <path d="M270 260h110"/>
    <path d="m365 245 15 15-15 15"/>
    <path d="M555 260h110"/>
    <path d="m650 245 15 15-15 15"/>
    <path d="M840 260h110"/>
    <path d="m935 245 15 15-15 15"/>
    <path d="M1035 340v70H165v-70"/>
    <path d="m150 355 15-15 15 15"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle">
    <rect x="80" y="180" width="190" height="160" fill="#dedede"/>
    <text x="175" y="273" fill="#0e0e0d">build</text>
    <rect x="365" y="180" width="190" height="160" fill="#a2a2a0"/>
    <text x="460" y="273" fill="#0e0e0d">break</text>
    <rect x="650" y="180" width="190" height="160" fill="#656563"/>
    <text x="745" y="273" fill="#f7f4ed">learn</text>
    <rect x="935" y="180" width="190" height="160" fill="#0e0e0d"/>
    <text x="1030" y="273" fill="#f7f4ed">repeat</text>
  </g>
</svg>
